# Continuity rules: npm run continuity (tools/narrative/continuity.ts, from the game-narrative skill).
# Each rule: a phrase (regex, case-sensitive unless flags: i) the prose may only use while a
# condition holds in the run showing it. The tool also flags the dead named after their death,
# unless the sentence is about the death or memory (memorial: adds this game's own words).
rules:
  - match: "Brother Osric has been telling"
    allow: npc.osric.met
    why: Osric only tells the story if he was carried across and met.
  - match: "knows about the wool-man"
    allow: flag.took_bribe
dead_names_ok: {}
memorial: []
