# Builds the Android app (an itch.io download) on pushes that change the game,
# and on demand (Actions > Android app > Run workflow). The APK is attached to
# the run as an artifact. Signing: repository secrets ANDROID_KEYSTORE_BASE64 and
# ANDROID_KEYSTORE_PASSWORD (docs/ANDROID.md). Without them it builds a TEST APK
# with a throwaway key that can never update an installed copy.
# (From Knight of Adalia's workflow. Not exercised in a cloud session: no Android SDK there.)
name: Android app

on:
  push:
    paths: [src/**, content/**, public/**, assets/**, android/**, index.html, package.json, package-lock.json, capacitor.config.ts, .github/workflows/android.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: {{WEB_BUILD}}
      - run: npx cap sync android
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key in the repository secrets: this is a test APK only. See docs/ANDROID.md."
          fi
      - name: Build the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../{{SLUG}}.apk
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../{{SLUG}}-TEST.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: {{SLUG}}-android
          path: '{{SLUG}}*.apk'
          retention-days: 30
